# Manual acceptance suite. Hits the long-lived Azure SQL + Postgres servers
# documented as prereqs in tests/acceptance/README.md — this workflow does not
# provision or destroy any infrastructure.

name: Acceptance Tests

on:
  workflow_dispatch:

# Tests create + drop principals with stable names on shared servers, so two
# concurrent runs would collide. Queue, don't cancel.
concurrency:
  group: acceptance-tests
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: acceptance-tests

    env:
      ARM_USE_OIDC:        ${{ secrets.AZURE_CLIENT_SECRET == '' && 'true' || 'false' }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # terraform-plugin-testing shells out to the `terraform` binary.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Run acceptance tests
        env:
          TF_ACC: '1'
          AZSQLACCESS_TEST_MSSQL_SERVER:      ${{ vars.AZSQLACCESS_TEST_MSSQL_SERVER }}
          AZSQLACCESS_TEST_DATABASE:          ${{ vars.AZSQLACCESS_TEST_DATABASE }}
          AZSQLACCESS_TEST_POSTGRES_SERVER:   ${{ vars.AZSQLACCESS_TEST_POSTGRES_SERVER }}
          AZSQLACCESS_TEST_POSTGRES_DATABASE: ${{ vars.AZSQLACCESS_TEST_POSTGRES_DATABASE }}
          AZSQLACCESS_TEST_USER_UPN:          ${{ vars.AZSQLACCESS_TEST_USER_UPN }}
          AZSQLACCESS_TEST_GROUP_NAME:        ${{ vars.AZSQLACCESS_TEST_GROUP_NAME }}
          AZSQLACCESS_TEST_GROUP_OBJECT_ID:   ${{ secrets.AZSQLACCESS_TEST_GROUP_OBJECT_ID }}
          AZSQLACCESS_TEST_SP_NAME:           ${{ vars.AZSQLACCESS_TEST_SP_NAME }}
          AZSQLACCESS_TEST_SP_OBJECT_ID:      ${{ secrets.AZSQLACCESS_TEST_SP_OBJECT_ID }}
        run: go test -v -timeout 30m -run '^TestAcc' ./internal/...
